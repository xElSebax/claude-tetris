<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">Tetris</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">APARIENCIA</span>
          <div class="skin-toggle" role="group" aria-label="Apariencia del tablero">
            <button type="button" data-skin="retro" class="skin-btn active" aria-pressed="true">Retro</button>
            <button type="button" data-skin="neon" class="skin-btn" aria-pressed="false">Neón</button>
            <button type="button" data-skin="pastel" class="skin-btn" aria-pressed="false">Pastel</button>
            <button type="button" data-skin="pixel" class="skin-btn" aria-pressed="false">Pixel</button>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <div class="theme-toggle">
            <button type="button" id="theme-dark" class="theme-btn active" aria-pressed="true">Oscuro</button>
            <button type="button" id="theme-light" class="theme-btn" aria-pressed="false">Claro</button>
          </div>
        </div>

        <div class="panel-section records-panel">
          <span class="label">RECORDS</span>
          <div id="sidebar-records" class="records-table-wrap"></div>
          <button type="button" id="sidebar-reset-records" class="records-reset-btn">Borrar records</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="overlay-box pause-menu">
        <p class="pause-title">PAUSA</p>
        <div class="pause-actions">
          <button type="button" id="resume-btn" class="menu-btn primary">Reanudar</button>
          <button type="button" id="pause-restart-btn" class="menu-btn">Reiniciar</button>
          <button type="button" id="toggle-controls-btn" class="menu-btn">Ver controles</button>
        </div>
        <div id="pause-controls" class="pause-controls hidden">
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída rápida</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
        <div class="pause-level">
          <span class="pause-level-label">Nivel inicial</span>
          <div class="level-selector">
            <button type="button" id="level-down" class="level-btn" aria-label="Bajar nivel">−</button>
            <span id="start-level-display" class="level-value">1</span>
            <button type="button" id="level-up" class="level-btn" aria-label="Subir nivel">+</button>
          </div>
        </div>
      </div>
    </div>

    <div id="game-over-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-stats" class="overlay-stats hidden"></p>
        <p id="overlay-qualify" class="overlay-qualify hidden">¡Entraste al top 5!</p>
        <div id="name-form" class="name-form hidden">
          <label for="player-name">Nombre</label>
          <input type="text" id="player-name" maxlength="20" placeholder="Tu nombre" autocomplete="off" />
          <button type="button" id="save-record-btn">Guardar puntuación</button>
        </div>
        <div id="overlay-records" class="records-table-wrap overlay-records"></div>
        <div class="overlay-actions">
          <button type="button" id="play-btn" class="hidden">Jugar</button>
          <button type="button" id="restart-btn" class="menu-btn primary">Reiniciar</button>
          <button type="button" id="reset-records-btn" class="records-reset-btn">Borrar records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
