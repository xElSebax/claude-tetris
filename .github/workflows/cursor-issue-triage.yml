# Triage GitHub issues with a Cursor Cloud Agent (create/edit only).
# Requires repo secret: CURSOR_ACTION_TOKEN (Cloud Agents API key from Cursor dashboard).
# Optional repo secret: GH_PAT — PAT with issues:write if the agent cannot comment/label with the default token.
#
# Disable any Cursor Automation that triggers on issue comments to avoid loops.

name: Cursor issue triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: cursor-issue-triage-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Skip if already triaged or in progress
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')"
          echo "labels=$labels"

          if echo "$labels" | grep -Eq '(^|,)cursor-triaged(,|$)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=already has cursor-triaged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$labels" | grep -Eq '(^|,)cursor-triaging(,|$)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=already has cursor-triaging" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate --jq '.[].body' || true)"
          if echo "$comments" | grep -Eiq '^## (Triage diagnosis|Diagnóstico de triage)\b'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=diagnosis comment already exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Ensure triage labels exist
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" desc="$3"
            if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc" || true
            fi
          }
          ensure_label "cursor-triaging" "FBCA04" "Cursor issue triage in progress"
          ensure_label "cursor-triaged" "0E8A16" "Cursor issue triage completed"

      - name: Mark issue as triaging
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "cursor-triaging"

      - name: Checkout (for triage prompt)
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v5

      - name: Launch Cursor Cloud Agent
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_ACTION_TOKEN: ${{ secrets.CURSOR_ACTION_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPO_URL: https://github.com/${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_ACTION_TOKEN:-}" ]; then
            echo "::error::Missing secret CURSOR_ACTION_TOKEN. Create a Cloud Agents API key in the Cursor dashboard (Cloud Agents → API keys) and add it as a repo secret."
            exit 1
          fi

          instructions="$(cat .github/prompts/cursor-issue-triage.md)"

          # Legacy v0 launch payload (stable for Actions). model "default" avoids invalid model-id 400s.
          payload="$(jq -n \
            --arg instructions "$instructions" \
            --arg issue "$ISSUE" \
            --arg title "$ISSUE_TITLE" \
            --arg body "${ISSUE_BODY:-}" \
            --arg url "$ISSUE_URL" \
            --arg user "$ISSUE_USER" \
            --arg repo "$REPO_URL" \
            --arg ref "$DEFAULT_BRANCH" \
            '
            def prompt_text:
              $instructions
              + "\n\n## Issue context\n"
              + "- Repository: `" + $repo + "`\n"
              + "- Issue number: #" + $issue + "\n"
              + "- Issue URL: " + $url + "\n"
              + "- Author: @" + $user + "\n"
              + "- Title: " + $title + "\n\n"
              + "### Issue body\n\n"
              + (if ($body | length) == 0 then "(empty)" else $body end)
              + "\n";

            {
              prompt: { text: prompt_text },
              model: "default",
              source: { repository: $repo, ref: $ref },
              target: { autoCreatePr: false }
            }
            ')"

          echo "Launching Cursor agent (v0) for issue #$ISSUE…"
          http_code="$(curl --silent --show-error \
            --output /tmp/cursor-agent-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://api.cursor.com/v0/agents" \
            -u "${CURSOR_ACTION_TOKEN}:" \
            --header "Content-Type: application/json" \
            --data "$payload")"

          echo "HTTP $http_code"
          cat /tmp/cursor-agent-response.json
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cursor API launch failed with HTTP $http_code. Check CURSOR_ACTION_TOKEN (Cloud Agents API key) and that this repo is connected in Cursor."
            jq . /tmp/cursor-agent-response.json 2>/dev/null || true
            exit 1
          fi

          agent_url="$(jq -r '.target.url // empty' /tmp/cursor-agent-response.json)"
          if [ -n "$agent_url" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "Triage encolado con Cursor Cloud Agent: $agent_url" \
              || true
          fi

      - name: Clear triaging label on failure
        if: failure() && steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "cursor-triaging" || true
