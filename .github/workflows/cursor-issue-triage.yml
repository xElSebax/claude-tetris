# Triage GitHub issues with a Cursor Cloud Agent (create/edit only).
# Requires repo secret: CURSOR_ACTION_TOKEN (Cloud Agents API key).
#
# Flow: launch agent → wait until finished → post diagnosis comment + labels on the issue.
# Disable Cursor Automations on issue comments to avoid loops.

name: Cursor issue triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: cursor-issue-triage-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Skip if already triaged or in progress
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')"
          echo "labels=$labels"

          if echo "$labels" | grep -Eq '(^|,)cursor-triaged(,|$)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=already has cursor-triaged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$labels" | grep -Eq '(^|,)cursor-triaging(,|$)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=already has cursor-triaging" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate --jq '.[].body' || true)"
          if echo "$comments" | grep -Eiq '^## (Triage diagnosis|Diagnóstico de triage)\b'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=diagnosis comment already exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Ensure labels exist
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" desc="$3"
            if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc" || true
            fi
          }
          ensure_label "cursor-triaging" "FBCA04" "Cursor issue triage in progress"
          ensure_label "cursor-triaged" "0E8A16" "Cursor issue triage completed"
          ensure_label "bug" "D73A4A" "Something isn't working"
          ensure_label "enhancement" "A2EEEF" "New feature or request"
          ensure_label "controls" "5319E7" "Input / keyboard controls"
          ensure_label "ui" "C5DEF5" "User interface"
          ensure_label "gameplay" "BFDADC" "Game rules / pieces / scoring"
          ensure_label "docs" "0075CA" "Documentation"
          ensure_label "question" "D876E3" "Further information is requested"

      - name: Mark issue as triaging
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "cursor-triaging"

      - name: Checkout (for triage prompt)
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v5

      - name: Launch, wait, and publish triage on the issue
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CURSOR_ACTION_TOKEN: ${{ secrets.CURSOR_ACTION_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPO_URL: https://github.com/${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_ACTION_TOKEN:-}" ]; then
            echo "::error::Missing secret CURSOR_ACTION_TOKEN."
            exit 1
          fi

          instructions="$(cat .github/prompts/cursor-issue-triage.md)"

          payload="$(jq -n \
            --arg instructions "$instructions" \
            --arg issue "$ISSUE" \
            --arg title "$ISSUE_TITLE" \
            --arg body "${ISSUE_BODY:-}" \
            --arg url "$ISSUE_URL" \
            --arg user "$ISSUE_USER" \
            --arg repo "$REPO_URL" \
            --arg ref "$DEFAULT_BRANCH" \
            '
            def prompt_text:
              $instructions
              + "\n\n## Issue context\n"
              + "- Repository: `" + $repo + "`\n"
              + "- Issue number: #" + $issue + "\n"
              + "- Issue URL: " + $url + "\n"
              + "- Author: @" + $user + "\n"
              + "- Title: " + $title + "\n\n"
              + "### Issue body\n\n"
              + (if ($body | length) == 0 then "(empty)" else $body end)
              + "\n";
            {
              prompt: { text: prompt_text },
              model: "default",
              source: { repository: $repo, ref: $ref },
              target: { autoCreatePr: false }
            }
            ')"

          echo "Launching Cursor agent for issue #$ISSUE…"
          http_code="$(curl --silent --show-error \
            --output /tmp/cursor-launch.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://api.cursor.com/v0/agents" \
            -u "${CURSOR_ACTION_TOKEN}:" \
            --header "Content-Type: application/json" \
            --data "$payload")"

          echo "Launch HTTP $http_code"
          cat /tmp/cursor-launch.json
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cursor API launch failed with HTTP $http_code."
            exit 1
          fi

          agent_id="$(jq -r '.id // empty' /tmp/cursor-launch.json)"
          agent_url="$(jq -r '.target.url // empty' /tmp/cursor-launch.json)"
          if [ -z "$agent_id" ]; then
            echo "::error::Launch response missing agent id."
            exit 1
          fi
          echo "agent_id=$agent_id"
          echo "agent_url=$agent_url"

          # Wait until the agent finishes (or fails).
          deadline=$((SECONDS + 1200))
          status=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl --silent --show-error \
              --output /tmp/cursor-status.json \
              --request GET \
              --url "https://api.cursor.com/v0/agents/${agent_id}" \
              -u "${CURSOR_ACTION_TOKEN}:"

            status="$(jq -r '.status // empty' /tmp/cursor-status.json)"
            echo "status=$status"
            case "$status" in
              FINISHED|COMPLETED|DONE) break ;;
              ERROR|FAILED|EXPIRED|CANCELLED|CANCELED)
                echo "::error::Cursor agent ended with status=$status"
                cat /tmp/cursor-status.json
                exit 1
                ;;
              *) sleep 20 ;;
            esac
          done

          if [ "$status" != "FINISHED" ] && [ "$status" != "COMPLETED" ] && [ "$status" != "DONE" ]; then
            echo "::error::Timed out waiting for Cursor agent (last status=$status)."
            exit 1
          fi

          # Fetch conversation and pick the best assistant diagnosis.
          curl --silent --show-error \
            --output /tmp/cursor-conversation.json \
            --request GET \
            --url "https://api.cursor.com/v0/agents/${agent_id}/conversation" \
            -u "${CURSOR_ACTION_TOKEN}:"

          diagnosis="$(jq -r '
            [
              .messages[]?
              | select((.type // "") | test("assistant"; "i"))
              | (.text // .content // "")
              | select(length > 0)
            ] as $msgs
            | ($msgs
                | map(select(test("##[[:space:]]+(Triage diagnosis|Diagn)"; "i")))
                | last)
              // ($msgs | last)
              // empty
          ' /tmp/cursor-conversation.json)"

          if [ -z "$diagnosis" ] || [ "$diagnosis" = "null" ]; then
            summary="$(jq -r '.summary // empty' /tmp/cursor-status.json)"
            if [ -n "$summary" ]; then
              {
                echo "## Diagnóstico de triage"
                echo
                echo "### Resumen"
                echo "$summary"
              } > /tmp/diagnosis-raw.md
              diagnosis="$(cat /tmp/diagnosis-raw.md)"
            else
              echo "::error::Could not extract a diagnosis from the agent conversation."
              cat /tmp/cursor-conversation.json
              exit 1
            fi
          fi

          # Parse LABELS: line (comma-separated). Strip that line from the posted body.
          labels_line="$(printf '%s\n' "$diagnosis" | grep -E '^LABELS:' | tail -n1 || true)"
          body="$(printf '%s\n' "$diagnosis" | sed -E '/^LABELS:/d')"

          # Append agent link as a small footer (diagnosis remains in the issue body).
          if [ -n "$agent_url" ]; then
            printf '%s\n\n%s\n%s\n' "$body" "----" "_Agente Cursor: ${agent_url}_" > /tmp/diagnosis-comment.md
          else
            printf '%s\n' "$body" > /tmp/diagnosis-comment.md
          fi

          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnosis-comment.md

          # Apply suggested labels + cursor-triaged; remove cursor-triaging.
          allowed='bug enhancement controls ui gameplay docs question'
          to_add="cursor-triaged"
          if [ -n "$labels_line" ]; then
            raw="$(printf '%s' "$labels_line" | sed -E 's/^LABELS:[[:space:]]*//')"
            IFS=',' read -r -a parts <<< "$raw"
            for p in "${parts[@]}"; do
              name="$(echo "$p" | sed 's/[^A-Za-z0-9_-]//g')"
              name="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
              if [ -z "$name" ]; then continue; fi
              if echo " $allowed " | grep -Fq " $name "; then
                to_add="$to_add,$name"
              fi
            done
          fi

          if ! gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label "cursor-triaging" \
            --add-label "$to_add"; then
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "cursor-triaging" || true
              IFS=',' read -r -a add_parts <<< "$to_add"
              for name in "${add_parts[@]}"; do
                [ -n "$name" ] || continue
                gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "$name" || true
              done
          fi

          echo "Published diagnosis and labels ($to_add) on #$ISSUE"

      - name: Clear triaging label on failure
        if: failure() && steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "cursor-triaging" || true
